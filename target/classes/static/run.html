<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>러닝 — RE:RUN</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/css/honor-run.css">
  <style>
    .run-layout { min-height: 100vh; display: flex; flex-direction: column; }
    .run-map-wrap { flex: 1; min-height: 280px; }
    @media (min-width: 768px) { .run-map-wrap { min-height: 420px; } }
  </style>
</head>
<body class="honor-dark run-layout">
  <nav class="navbar navbar-dark navbar-honor py-2">
    <div class="container-fluid px-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
      <a class="navbar-brand small mb-0" href="/"><i class="bi bi-chevron-left"></i> 메인</a>
      <span class="small text-end">
        <span class="fw-bold" style="background: linear-gradient(115deg,#ff3b30,#007aff); -webkit-background-clip: text; background-clip: text; color: transparent;">RE:RUN</span>
        <span class="text-muted mx-1">·</span>
        <span class="text-light" id="run-course-label">독립의 함성 길</span>
      </span>
    </div>
  </nav>

  <div class="container-fluid px-3 pt-2 d-none" id="run-pair-wrap">
    <div class="alert border mb-0 py-2 px-3 d-flex align-items-start gap-2 small" role="status"
      style="background: linear-gradient(125deg, rgba(255,59,48,0.2), rgba(0,122,255,0.18)); border-color: rgba(255,255,255,0.2) !important; color: rgba(248,250,252,0.95);">
      <i class="bi bi-link-45deg flex-shrink-0 mt-1"></i>
      <span id="run-pair-banner-text" class="flex-grow-1"></span>
      <button type="button" class="btn-close btn-close-white flex-shrink-0 mt-1" id="run-pair-dismiss" aria-label="배너 닫기"></button>
    </div>
  </div>

  <div class="container-fluid px-3 pt-3 pb-2">
    <div class="row g-2">
      <div class="col-4">
        <div class="stat-pill">
          <div class="label">경과 시간</div>
          <div class="value red" id="stat-time">00:00:00</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-pill">
          <div class="label">이동 거리</div>
          <div class="value" id="stat-dist">0.0 km</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-pill">
          <div class="label">소모 열량</div>
          <div class="value blue" id="stat-kcal">0 kcal</div>
        </div>
      </div>
    </div>
  </div>

  <div class="px-3 run-map-wrap flex-grow-1 d-flex">
    <div id="run-map" class="w-100 flex-grow-1"></div>
  </div>

  <div class="container-fluid px-3 py-3 mt-auto">
    <div class="story-card p-3 mb-2">
      <div class="d-flex align-items-center gap-2 mb-2">
        <i class="bi bi-signpost-2 accent-gold" style="color: var(--honor-gold)"></i>
        <span class="small text-uppercase text-muted">현재 안내</span>
      </div>
      <div id="active-story" class="small">불러오는 중…</div>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button type="button" class="btn btn-honor-outline flex-grow-1" id="btn-checkin" disabled>
        <i class="bi bi-geo-alt-fill me-1"></i>역사 속으로 체크인
      </button>
      <button type="button" class="btn btn-honor-primary" id="btn-finish">러닝 종료</button>
    </div>
    <p class="small text-muted mt-2 mb-0" id="checkin-hint">사적지에 가까이 가면 체크인이 활성화됩니다.</p>
  </div>

  <div class="modal fade" id="modal-checkpoint" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content honor-modal">
        <div class="modal-header border-secondary border-opacity-25">
          <h5 class="modal-title" id="modal-cp-title">사적지</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0" id="modal-cp-body"></p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modal-checkin" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content honor-modal">
        <div class="modal-header border-secondary border-opacity-25">
          <h5 class="modal-title">역사 속으로 체크인</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="lead" id="checkin-headline"></p>
          <p class="text-muted" id="checkin-place"></p>
          <div class="row g-3">
            <div class="col-md-6">
              <p class="small text-muted mb-1">과거</p>
              <img id="checkin-past" class="compare-img" alt="과거 사진">
            </div>
            <div class="col-md-6">
              <p class="small text-muted mb-1">현재</p>
              <img id="checkin-present" class="compare-img" alt="현재 사진">
            </div>
          </div>
          <p class="small mt-3 mb-0" id="checkin-caption"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/js/run-page.js"></script>
</body>
</html>
